name: Automated FTP Deploy to Live Server

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Files to Web Server
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Fetch Latest Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Ensure remote folders exist (fixes 550 /assets)
        # Resolves server-dir relative to the FTP login folder (default ./).
        # If .github/reset-ftp-state exists, deletes ONLY the old action's
        # .ftp-deploy-sync-state.json. Never deletes site files.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          set -euo pipefail
          DIR="${FTP_SERVER_DIR:-./}"; DIR="${DIR%/}"; [ -z "$DIR" ] && DIR="."
          RESET=""
          if [ -f .github/reset-ftp-state ]; then RESET="rm -f .ftp-deploy-sync-state.json"; echo "::notice::Reset marker found: removing the FTP sync state file only"; fi
          cat > /tmp/pre.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 5
          set net:timeout 30
          echo "login folder:"
          pwd
          cd "$DIR"
          echo "server-dir:"
          pwd
          cls -1a
          cls -d assets || mkdir assets
          cls -d assets
          $RESET
          echo "after:"
          cls -1a
          bye
          EOF
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" -e "source /tmp/pre.lftp" 2>&1 | tee /tmp/pre.out
          AFTER=$(sed -n '/^after:/,$p' /tmp/pre.out)
          HAS_ASSETS=$(echo "$AFTER" | grep -cxE 'assets/?' || true)
          HAS_STATE=$(echo "$AFTER" | grep -cx '.ftp-deploy-sync-state.json' || true)
          echo "::notice::server-dir present, assets folder present=$HAS_ASSETS, sync state file present=$HAS_STATE, entries=$(echo "$AFTER" | tail -n +2 | wc -l)"
          [ "$HAS_ASSETS" -ge 1 ] || { echo "::error::assets folder still missing in server-dir"; exit 1; }

      - name: Temporary pages-only sync (_astro, HTML, sitemap, robots)
        # TEMPORARY pages-only mode to finish deploy of 8d7fa7c.
        # The previous full-site run uploaded images, _opt, video and _astro
        # but failed before the HTML stage. This workflow uploads ONLY:
        #   1) the _astro folder (styles/scripts) first
        #   2) every *.html file
        #   3) sitemap*.xml and robots.txt
        # It does NOT walk, compare, or upload _opt, images, video, or any
        # image/video extensions — so it cannot re-upload those assets.
        # No --delete. The original full-site workflow is saved as
        # .github/workflows/deploy-full.yml.disabled and must be restored
        # (or replaced with a faster incremental deploy) before the next
        # image or video change.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          set -euo pipefail
          DIR="${FTP_SERVER_DIR:-./}"; DIR="${DIR%/}"; [ -z "$DIR" ] && DIR="."

          echo "::notice::TEMPORARY pages-only deploy: _astro, then HTML, then sitemap/robots. Not comparing or uploading _opt, images, or video."

          cat > /tmp/lftp-settings <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set net:max-retries 15
          set net:persist-retries 8
          set net:reconnect-interval-base 15
          set net:reconnect-interval-multiplier 1.5
          set net:reconnect-interval-max 180
          set net:timeout 90
          set net:idle 90
          set xfer:clobber on
          set mirror:use-pget-n 0
          EOF

          run_lftp() {
            local name="$1"
            local script="$2"
            local attempt=1
            local max=25
            while [ "$attempt" -le "$max" ]; do
              echo "::notice::lftp ${name}: attempt ${attempt}/${max} at $(date -u +%H:%M:%S)Z"
              set +e
              lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" -e "source /tmp/lftp-settings; source ${script}"
              local rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                echo "::notice::lftp ${name}: succeeded on attempt ${attempt}"
                return 0
              fi
              echo "::warning::lftp ${name}: attempt ${attempt} exited ${rc} (connection likely dropped); retrying in 20s"
              sleep 20
              attempt=$((attempt+1))
            done
            echo "::error::lftp ${name}: failed after ${max} attempts"
            return 1
          }

          # Stage 1: _astro only. Mirror is scoped to this folder so other
          # assets are never listed or compared. --ignore-time skips already-
          # uploaded files whose size matches (checkout mtimes are fresh).
          # --parallel=4. Image/video globs are excluded as a guard.
          # No --delete.
          cat > /tmp/mirror-astro.lftp <<EOF
          cd "$DIR"
          lcd .
          EOF
          cat >> /tmp/mirror-astro.lftp <<'EOF'
          mirror -R --verbose --ignore-time --continue --parallel=4 --no-perms --no-umask --exclude-glob '*.png' --exclude-glob '*.jpg' --exclude-glob '*.jpeg' --exclude-glob '*.gif' --exclude-glob '*.webp' --exclude-glob '*.avif' --exclude-glob '*.svg' --exclude-glob '*.ico' --exclude-glob '*.bmp' --exclude-glob '*.mp4' --exclude-glob '*.webm' --exclude-glob '*.mov' --exclude-glob '*.m4v' --exclude-glob '*.mp3' --exclude-glob '*.wav' --exclude-glob '*.ogg' --exclude-glob '*.mkv' --exclude-glob '*.avi' _astro _astro
          bye
          EOF
          run_lftp "astro" /tmp/mirror-astro.lftp

          # Stage 2: HTML last so pages never point at missing styles.
          # Explicit put commands: no full-tree mirror, so _opt/images/video
          # are never compared. Re-puts are cheap; HTML is small.
          python3 - <<'PY'
          from pathlib import Path
          skip = {'.git', '.github', 'node_modules'}
          htmls = sorted(
              p for p in Path('.').rglob('*.html')
              if not any(part in skip for part in p.parts)
          )
          dirs = sorted({p.parent.as_posix() for p in htmls} - {'.'})
          out = Path('/tmp/html-puts.lftp')
          body = ['lcd .']
          for d in dirs:
              body.append('mkdir -f -p ' + d)
          for p in htmls:
              dest = p.parent.as_posix()
              body.append('put -O ' + dest + ' ' + p.as_posix())
          body.append('bye')
          out.write_text('\n'.join(body) + '\n', encoding='utf-8')
          print('html files=%d dirs=%d' % (len(htmls), len(dirs)))
          PY
          {
            echo "cd \"$DIR\""
            cat /tmp/html-puts.lftp
          } > /tmp/mirror-html.lftp
          run_lftp "html" /tmp/mirror-html.lftp

          # Stage 3: sitemap*.xml and robots.txt at the site root.
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('.').glob('sitemap*.xml'))
          if Path('robots.txt').is_file():
              files.append(Path('robots.txt'))
          for n in ['favicon.ico','favicon.svg','apple-touch-icon.png','icon-192.png','icon-512.png','site.webmanifest']:
              if Path(n).is_file():
                  files.append(Path(n))
          body = ['lcd .']
          for p in files:
              body.append('put -O . ' + p.as_posix())
          body.append('bye')
          Path('/tmp/meta-puts.lftp').write_text('\n'.join(body) + '\n', encoding='utf-8')
          print('meta files=%d: %s' % (len(files), ' '.join(p.name for p in files)))
          PY
          {
            echo "cd \"$DIR\""
            cat /tmp/meta-puts.lftp
          } > /tmp/mirror-meta.lftp
          run_lftp "sitemap-robots" /tmp/mirror-meta.lftp

          echo "::notice::pages-only lftp deploy finished all stages at $(date -u +%H:%M:%S)Z"
